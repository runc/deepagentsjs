<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文档助手 · 知识工作空间</title>
    <style>
      :root {
        --background: oklch(0.99 0.005 260);
        --foreground: oklch(0.18 0.02 260);
        --card: oklch(1 0 0);
        --muted: oklch(0.96 0.008 260);
        --muted-fg: oklch(0.48 0.02 260);
        --border: oklch(0.9 0.01 260);
        --primary: oklch(0.52 0.17 250);
        --primary-fg: oklch(0.99 0 0);
        --accent: oklch(0.94 0.02 260);
        --radius: 10px;
        --left-w: 248px;
        --right-w: 380px;
        --topbar-h: 52px;
        --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font);
        font-size: 13px;
        line-height: 1.5;
        overflow: hidden;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      code {
        font-family: var(--mono);
        font-size: 11px;
      }

      .app-shell {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      /* Top bar */
      .topbar {
        height: var(--topbar-h);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px 0 16px;
        border-bottom: 1px solid var(--border);
        background: color-mix(in oklch, var(--card) 92%, var(--background));
        flex-shrink: 0;
      }

      .topbar-left {
        display: flex;
        align-items: center;
        gap: 16px;
        min-width: 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: var(--primary);
        color: var(--primary-fg);
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
      }

      .brand-name {
        font-weight: 600;
        font-size: 14px;
      }

      .ws-switcher {
        position: relative;
        min-width: 0;
      }

      .ws-switcher-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        cursor: pointer;
        max-width: 320px;
        color: inherit;
      }

      .ws-switcher-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 500;
      }

      .ws-switcher-menu {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        width: 320px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 12px 40px oklch(0.2 0.02 260 / 0.12);
        z-index: 50;
        padding: 6px;
      }

      .ws-switcher-item {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: 100%;
        padding: 10px 12px;
        border: none;
        border-radius: 8px;
        background: transparent;
        cursor: pointer;
        text-align: left;
        color: inherit;
      }

      .ws-switcher-item:hover,
      .ws-switcher-item.is-active {
        background: var(--accent);
      }

      .ws-switcher-item-name {
        font-weight: 500;
      }

      .ws-switcher-item-meta {
        font-size: 11px;
        color: var(--muted-fg);
        margin-top: 2px;
      }

      .ws-switcher-divider {
        height: 1px;
        background: var(--border);
        margin: 4px 0;
      }

      .ws-switcher-new {
        flex-direction: row;
        align-items: center;
        gap: 6px;
        color: var(--primary);
        font-weight: 500;
      }

      .topbar-nav {
        display: flex;
        gap: 6px;
      }

      .nav-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        cursor: pointer;
        color: var(--muted-fg);
      }

      .nav-btn.is-active {
        background: var(--primary);
        color: var(--primary-fg);
        border-color: var(--primary);
      }

      .nav-btn:not(.is-active):hover {
        background: var(--muted);
        color: var(--foreground);
      }

      /* Three-column layout */
      .workspace-layout {
        display: grid;
        grid-template-columns: var(--left-w) minmax(0, 1fr) var(--right-w);
        flex: 1;
        min-height: 0;
      }

      .pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--card);
      }

      .pane-left {
        border-right: 1px solid var(--border);
        background: color-mix(in oklch, var(--muted) 35%, var(--card));
      }

      .pane-center {
        background: var(--card);
      }

      .pane-right {
        border-left: 1px solid var(--border);
        background: color-mix(in oklch, var(--background) 50%, var(--card));
      }

      .pane-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      .pane-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted-fg);
      }

      .pane-actions {
        display: flex;
        gap: 4px;
      }

      .icon-btn {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--card);
        cursor: pointer;
        color: var(--muted-fg);
      }

      .icon-btn:hover {
        color: var(--foreground);
        background: var(--accent);
      }

      /* Tree */
      .tree-search {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 8px 10px;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: var(--muted-fg);
      }

      .tree-search input {
        border: none;
        outline: none;
        background: transparent;
        flex: 1;
        min-width: 0;
        color: inherit;
      }

      .tree-scroll {
        flex: 1;
        overflow: auto;
        padding: 4px 6px 12px;
      }

      .tree-row {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 5px 8px;
        border: none;
        border-radius: 6px;
        background: transparent;
        cursor: pointer;
        color: inherit;
        text-align: left;
      }

      .tree-row:hover {
        background: var(--accent);
      }

      .tree-row.is-active {
        background: color-mix(in oklch, var(--primary) 12%, var(--card));
        color: var(--primary);
      }

      .tree-row svg {
        flex-shrink: 0;
        opacity: 0.7;
      }

      .tree-chevron {
        width: 14px;
        display: grid;
        place-items: center;
        color: var(--muted-fg);
      }

      .tree-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
      }

      .tree-footer {
        padding: 8px 12px;
        border-top: 1px solid var(--border);
        flex-shrink: 0;
      }

      .tree-stat {
        display: flex;
        gap: 6px;
        font-size: 11px;
        color: var(--muted-fg);
      }

      /* Editor */
      .editor-tabs {
        display: flex;
        gap: 2px;
        padding: 6px 8px 0;
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
        flex-shrink: 0;
      }

      .editor-tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border: 1px solid transparent;
        border-bottom: none;
        border-radius: 8px 8px 0 0;
        background: transparent;
        cursor: pointer;
        color: var(--muted-fg);
        white-space: nowrap;
      }

      .editor-tab.is-active {
        background: var(--card);
        border-color: var(--border);
        color: var(--foreground);
        margin-bottom: -1px;
        padding-bottom: 7px;
      }

      .editor-tab.is-dirty .editor-tab-name::after {
        content: " •";
        color: var(--primary);
      }

      .editor-tab-close {
        opacity: 0.5;
        padding: 0 2px;
      }

      .editor-tab-close:hover {
        opacity: 1;
      }

      .editor-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      .editor-path code {
        color: var(--muted-fg);
      }

      .editor-toolbar-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .segmented {
        display: inline-flex;
        padding: 2px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--muted);
      }

      .segmented button {
        padding: 4px 10px;
        border: none;
        border-radius: 6px;
        background: transparent;
        cursor: pointer;
        color: var(--muted-fg);
        font-size: 12px;
      }

      .segmented button.is-active {
        background: var(--card);
        color: var(--foreground);
        box-shadow: 0 1px 2px oklch(0 0 0 / 0.06);
      }

      .sync-badge {
        font-size: 11px;
        color: var(--muted-fg);
      }

      .editor-body {
        flex: 1;
        min-height: 0;
        display: grid;
      }

      .editor-body.mode-edit {
        grid-template-columns: 1fr;
      }

      .editor-body.mode-preview {
        grid-template-columns: 1fr;
      }

      .editor-body.mode-split {
        grid-template-columns: 1fr 1fr;
      }

      .editor-source {
        display: flex;
        min-height: 0;
        border-right: 1px solid var(--border);
      }

      .mode-preview .editor-source {
        display: none;
      }

      .mode-edit .editor-preview {
        display: none;
      }

      .line-numbers {
        display: flex;
        flex-direction: column;
        padding: 12px 8px;
        text-align: right;
        color: var(--muted-fg);
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.6;
        border-right: 1px solid var(--border);
        background: color-mix(in oklch, var(--muted) 40%, var(--card));
        user-select: none;
        overflow: hidden;
      }

      .editor-textarea {
        flex: 1;
        border: none;
        outline: none;
        resize: none;
        padding: 12px 16px;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.6;
        background: transparent;
        color: inherit;
      }

      .editor-preview {
        overflow: auto;
        padding: 20px 24px;
        background: var(--card);
      }

      .prose h1 {
        font-size: 1.5rem;
        margin: 0 0 12px;
      }

      .prose h2 {
        font-size: 1.15rem;
        margin: 20px 0 8px;
      }

      .prose h3 {
        font-size: 1rem;
        margin: 16px 0 6px;
      }

      .prose blockquote {
        margin: 12px 0;
        padding-left: 12px;
        border-left: 3px solid var(--primary);
        color: var(--muted-fg);
      }

      .prose code {
        background: var(--muted);
        padding: 1px 5px;
        border-radius: 4px;
      }

      .prose pre {
        background: oklch(0.22 0.02 260);
        color: oklch(0.95 0 0);
        padding: 12px;
        border-radius: 8px;
        overflow: auto;
      }

      .prose table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        margin: 12px 0;
      }

      .prose th,
      .prose td {
        border: 1px solid var(--border);
        padding: 6px 10px;
        text-align: left;
      }

      .prose th {
        background: var(--muted);
      }

      .prose ul {
        padding-left: 20px;
      }

      .md-check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0;
      }

      /* Agent panel */
      .agent-status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--muted-fg);
      }

      .pulse-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--primary);
        animation: pulse 1.2s ease infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      .agent-context {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex-shrink: 0;
      }

      .agent-context-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
      }

      .agent-context-row .muted {
        color: var(--muted-fg);
        flex-shrink: 0;
      }

      .agent-context-row code {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .agent-messages {
        flex: 1;
        min-height: 120px;
        overflow: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .msg-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted-fg);
        margin-bottom: 4px;
      }

      .msg-bubble {
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .msg-user .msg-bubble {
        background: color-mix(in oklch, var(--primary) 14%, var(--card));
        border: 1px solid color-mix(in oklch, var(--primary) 25%, var(--border));
      }

      .msg-tool-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px dashed var(--border);
        background: var(--card);
        font-size: 11px;
        color: var(--muted-fg);
      }

      .msg-tool-name {
        font-family: var(--mono);
        color: var(--primary);
      }

      .agent-section {
        border-top: 1px solid var(--border);
        flex-shrink: 0;
      }

      .agent-section-head {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 8px 12px;
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted-fg);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .agent-section-count {
        margin-left: auto;
        background: var(--muted);
        padding: 1px 6px;
        border-radius: 999px;
        font-size: 10px;
      }

      .agent-section-body {
        padding: 0 12px 10px;
      }

      .todo-item {
        display: flex;
        gap: 8px;
        padding: 4px 0;
        font-size: 12px;
      }

      .todo-status {
        color: var(--muted-fg);
        width: 14px;
      }

      .todo-item.status-done {
        color: var(--muted-fg);
        text-decoration: line-through;
      }

      .todo-item.status-in_progress .todo-status {
        color: var(--primary);
      }

      .tool-call {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 8px;
        padding: 4px 0;
        font-size: 11px;
        font-family: var(--mono);
      }

      .tool-call.status-running .tool-call-status {
        color: var(--primary);
      }

      .subagent-row {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 4px 0;
        font-size: 11px;
      }

      .subagent-name {
        font-weight: 600;
        color: var(--primary);
      }

      .subagent-task {
        color: var(--muted-fg);
      }

      .agent-composer {
        border-top: 1px solid var(--border);
        padding: 10px 12px 12px;
        flex-shrink: 0;
        background: var(--card);
      }

      .agent-composer textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        resize: none;
        outline: none;
        background: var(--background);
      }

      .agent-composer textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px color-mix(in oklch, var(--primary) 18%, transparent);
      }

      .agent-composer-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 8px;
        gap: 8px;
      }

      .composer-hint {
        font-size: 10px;
        color: var(--muted-fg);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid transparent;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
      }

      .btn-primary {
        background: var(--primary);
        color: var(--primary-fg);
      }

      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-outline {
        background: var(--card);
        border-color: var(--border);
        color: var(--foreground);
      }

      @media (max-width: 1100px) {
        :root {
          --right-w: 320px;
          --left-w: 220px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <script type="text/babel" src="data.jsx"></script>
    <script type="text/babel" src="icons.jsx"></script>
    <script type="text/babel" src="workspace-tree.jsx"></script>
    <script type="text/babel" src="editor-pane.jsx"></script>
    <script type="text/babel" src="agent-panel.jsx"></script>
    <script type="text/babel" src="app.jsx"></script>
  </body>
</html>
